name: Continuous Website Health Check

on:
  schedule:
    # Định kỳ 3 tiếng một lần
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài đặt Dependencies
        run: npm install

      - name: Cài đặt Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Chạy kiểm tra tự động
        run: npx playwright test

      - name: Đẩy Báo cáo lên GitHub Pages (Web Online)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports

      - name: Gửi thông báo kết quả qua Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node notify.js